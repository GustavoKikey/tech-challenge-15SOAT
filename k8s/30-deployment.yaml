# =====================================================================
# Deployment — a aplicação (API Quarkus)
# ---------------------------------------------------------------------
# Mantém N réplicas idênticas do container rodando, faz rolling update
# sem downtime e recria pods que morrerem. A quantidade de réplicas é
# controlada pelo HPA (50-hpa.yaml).
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-app
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-app
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina
spec:
  # 'replicas' fica de fora DE PROPÓSITO: quem decide a escala é o HPA.
  # Se declarado aqui, cada 'kubectl apply' resetaria a escala calculada
  # pelo autoscaler de volta para o valor fixo do manifesto.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # sobe 1 pod novo por vez...
      maxUnavailable: 0  # ...sem derrubar nenhum antigo antes (zero downtime)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-app
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: oficina
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001             # UID do usuário 'app' criado no Dockerfile
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Imagem construída localmente (scripts/deploy-app.ps1 | .sh)
          # ou publicada no GHCR pela pipeline de CD (.github/workflows/
          # cd.yml) — nos dois casos ela entra nos nós via 'kind load
          # docker-image', por isso 'Never': impede o cluster de tentar
          # baixar uma imagem homônima do Docker Hub. Em cluster
          # gerenciado (EKS/GKE/AKS), trocar pela referência do registry
          # (ghcr.io/...) + policy IfNotPresent.
          image: oficina-mvp:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-app-config
            - secretRef:
                name: oficina-app-secrets
          env:
            # Credenciais do banco: fonte única é o Secret criado pelo
            # Terraform junto com o Postgres (infra/database.tf).
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: oficina-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-db-credentials
                  key: password
            # License key do New Relic. O Secret é criado fora do Git:
            #   kubectl -n oficina create secret generic oficina-newrelic \
            #     --from-literal=license-key=SUA_CHAVE
            # optional: true faz a app subir normalmente sem a chave — os
            # traces simplesmente não são exportados, em vez de travar o pod.
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: oficina-newrelic
                  key: license-key
                  optional: true
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/oficina/jwt
              readOnly: true
            # Filesystem raiz é read-only (securityContext abaixo);
            # a JVM/Vert.x precisa de um /tmp gravável.
            - name: tmp
              mountPath: /tmp
          # Requests/limits calibrados para o HPA:
          # - CPU: request baixo + limit 4x maior => sob carga o pod pode
          #   ultrapassar 100% de utilização do request, acionando o
          #   scale-up rápido (utilização do HPA é medida sobre o request);
          # - memória: request = limit (JVM não devolve memória ao SO;
          #   heap limitado a 50% via JAVA_OPTS no ConfigMap).
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # Probes usam os endpoints do SmallRye Health (quarkus-smallrye-health):
          # - startup: segura liveness/readiness até o boot + migrações Flyway;
          # - readiness: tira o pod do Service se não puder receber tráfego;
          # - liveness: reinicia o container se a app travar.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 2
            failureThreshold: 45   # até ~90s para subir
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: jwt-keys
          secret:
            secretName: oficina-jwt-keys
        - name: tmp
          emptyDir: {}
