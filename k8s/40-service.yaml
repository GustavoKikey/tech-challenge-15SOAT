# =====================================================================
# Service — ponto de acesso estável para os pods da aplicação
# ---------------------------------------------------------------------
# Pods nascem e morrem (HPA, rolling update); o Service dá um único
# DNS/IP fixo e balanceia as requisições entre os pods prontos
# (readinessProbe OK).
#
# - Dentro do cluster:  http://oficina-app  (porta 80)
# - Fora do cluster:    NodePort 30080, que o kind mapeia para
#   http://localhost:8080 (extra_port_mappings em infra/cluster.tf).
#   Em outros clusters: kubectl -n oficina port-forward svc/oficina-app 8080:80
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: oficina-app
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-app
    app.kubernetes.io/part-of: oficina
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: oficina-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
