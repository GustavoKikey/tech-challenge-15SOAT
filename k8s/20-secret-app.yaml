# =====================================================================
# Secret — variáveis sensíveis da aplicação
# ---------------------------------------------------------------------
# ATENÇÃO: os valores abaixo são de DESENVOLVIMENTO, para o ambiente
# local subir sem configuração extra. Em um ambiente
# real, este arquivo NÃO seria versionado: o Secret viria de um cofre
# (AWS Secrets Manager, Vault, SealedSecrets, External Secrets Operator).
#
# 'stringData' aceita texto puro e o Kubernetes armazena como base64.
#
# As credenciais do BANCO não estão aqui: ficam no Secret
# 'oficina-db-credentials', criado pelo Terraform junto com o Postgres
# (fonte única — app e banco leem do mesmo lugar).
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: oficina-app-secrets
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-app
    app.kubernetes.io/part-of: oficina
type: Opaque
stringData:
  # Senha do usuário 'admin' provisionado no bootstrap da aplicação.
  ADMIN_PASSWORD: "admin123"

  # Credenciais SMTP — vazias porque QUARKUS_MAILER_MOCK=true no ambiente local.
  # Preencher apenas se for ativar envio real de e-mail.
  SMTP_USER: ""
  SMTP_PASSWORD: ""
