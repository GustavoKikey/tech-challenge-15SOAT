# =====================================================================
# Secret — par de chaves RSA usado para assinar/verificar o JWT
# ---------------------------------------------------------------------
# O Deployment monta este Secret como arquivos em /etc/oficina/jwt e o
# ConfigMap aponta o SmallRye JWT para lá (MP_JWT_VERIFY_PUBLICKEY_
# LOCATION / SMALLRYE_JWT_SIGN_KEY_LOCATION). Assim as chaves saem do
# classpath da imagem e passam a ser gerenciadas pelo cluster — o padrão
# correto para segredo em Kubernetes.
#
# ATENÇÃO: este é o MESMO par de chaves de desenvolvimento já versionado
# em src/main/resources (nenhum segredo novo foi exposto). Em produção,
# gere um par exclusivo e entregue via cofre de segredos:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out privateKey.pem
#   openssl rsa -pubout -in privateKey.pem -out publicKey.pem
#   kubectl -n oficina create secret generic oficina-jwt-keys \
#     --from-file=privateKey.pem --from-file=publicKey.pem
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: oficina-jwt-keys
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-app
    app.kubernetes.io/part-of: oficina
type: Opaque
