services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
    ports:
      - "5432:5432"
    volumes:
      - oficina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U oficina -d oficina" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oficina-mvp:latest
    container_name: oficina-app
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/oficina
      DB_USER: oficina
      DB_PASSWORD: oficina
      QUARKUS_HTTP_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"UP\"' || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  sonar-postgres:
    image: postgres:16-alpine
    container_name: oficina-sonar-postgres
    profiles: [ "tools" ]
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - oficina_sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sonar -d sonar" ]
      interval: 5s
      timeout: 3s
      retries: 10

  sonarqube:
    image: sonarqube:lts-community
    container_name: oficina-sonarqube
    profiles: [ "tools" ]
    restart: unless-stopped
    depends_on:
      sonar-postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - oficina_sonar_data:/opt/sonarqube/data
      - oficina_sonar_extensions:/opt/sonarqube/extensions
      - oficina_sonar_logs:/opt/sonarqube/logs

volumes:
  oficina_postgres_data:
  oficina_sonar_db:
  oficina_sonar_data:
  oficina_sonar_extensions:
  oficina_sonar_logs:
