# ===== HTTP =====
quarkus.http.port=8080

# ===== Datasource (Postgres) =====
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:oficina}
quarkus.datasource.password=${DB_PASSWORD:oficina}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina}

# ===== Hibernate ORM =====
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# ===== Flyway =====
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# ===== Mailer (notificação de status da OS) =====
# Em %dev/%test o Quarkus usa mock automaticamente (loga em vez de enviar).
# Em produção, configurar via env: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD.
quarkus.mailer.from=${MAIL_FROM:oficina@techchallenge.local}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=OPTIONAL

# ===== OpenAPI / Swagger UI =====
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.smallrye-openapi.path=/openapi

mp.openapi.extensions.smallrye.info.title=Oficina MVP API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Tech Challenge Fase 1 — Sistema de Gestão de Oficina Mecânica.

# ===== JWT  =====
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=oficina-mvp
smallrye.jwt.sign.key.location=privateKey.pem

# Duração do token (ISO-8601). Ex.: PT8H = 8 horas, PT30M = 30 minutos.
oficina.jwt.expiration=PT8H

# Bootstrap do admin inicial (sobrescrever via env em produção).
oficina.admin.username=admin
oficina.admin.password=${ADMIN_PASSWORD:admin123}

# Deny-by-default: rotas não anotadas com @PermitAll/@RolesAllowed exigem autenticação.
quarkus.http.auth.proactive=true
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Habilita o botão "Authorize" (Bearer) no Swagger UI.
mp.openapi.extensions.smallrye.security-scheme=jwt
mp.openapi.extensions.smallrye.security-scheme-name=BearerAuth
mp.openapi.extensions.smallrye.security-scheme-description=JWT Bearer token (cole apenas o token, sem prefixo)

# ===== Profile %dev =====
# Eco de SQL desligado para manter o console limpo em demonstrações.
# Para depurar queries, troque para true (só afeta o modo dev).
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.log.category."br.com.fiap.techchallenge".level=DEBUG

# ===== Profile %test =====
# Usa Testcontainers Postgres via devservices (mais fiel que H2).
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.generation=validate
%test.oficina.admin.password=admin123
%test.quarkus.log.category."org.hibernate.sql.results.jdbc.internal.DeferredResultSetAccess".level=ERROR
