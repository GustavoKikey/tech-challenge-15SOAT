# ===== HTTP =====
quarkus.http.port=8080

# ===== Datasource (Postgres) =====
# URL/credenciais só em %prod e %dev: em %test elas NÃO podem existir, senão o
# Quarkus ignora o banco do Testcontainers (devservices) e conecta no URL fixo —
# os ITs passariam a depender de um Postgres externo com dados persistentes.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:oficina}
%prod.quarkus.datasource.password=${DB_PASSWORD:oficina}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina}
%dev.quarkus.datasource.username=${DB_USER:oficina}
%dev.quarkus.datasource.password=${DB_PASSWORD:oficina}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina}

# ===== Hibernate ORM =====
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# ===== Flyway =====
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# ===== Mailer (notificação de status da OS) =====
# Em %dev/%test o Quarkus usa mock automaticamente (loga em vez de enviar).
# Em produção, configurar via env: SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD.
quarkus.mailer.from=${MAIL_FROM:oficina@techchallenge.local}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:587}
quarkus.mailer.username=${SMTP_USER:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=OPTIONAL

# ===== OpenAPI / Swagger UI =====
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.smallrye-openapi.path=/openapi

mp.openapi.extensions.smallrye.info.title=Oficina MVP API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Tech Challenge 15SOAT — Sistema de Gestão de Oficina Mecânica (fases 1 e 2).

# ===== JWT  =====
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=oficina-mvp
smallrye.jwt.sign.key.location=privateKey.pem

# Duração do token (ISO-8601). Ex.: PT8H = 8 horas, PT30M = 30 minutos.
oficina.jwt.expiration=PT8H

# Bootstrap do admin inicial (sobrescrever via env em produção).
oficina.admin.username=admin
oficina.admin.password=${ADMIN_PASSWORD:admin123}

# Deny-by-default: rotas não anotadas com @PermitAll/@RolesAllowed exigem autenticação.
quarkus.http.auth.proactive=true
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Habilita o botão "Authorize" (Bearer) no Swagger UI.
mp.openapi.extensions.smallrye.security-scheme=jwt
mp.openapi.extensions.smallrye.security-scheme-name=BearerAuth
mp.openapi.extensions.smallrye.security-scheme-description=JWT Bearer token (cole apenas o token, sem prefixo)

# ===== Observabilidade (fase 3) =====
# Nome do serviço que identifica a aplicação no New Relic.
quarkus.application.name=oficina-app
quarkus.otel.service.name=oficina-app
quarkus.otel.resource.attributes=service.namespace=oficina,deployment.environment=${AMBIENTE:local}

# Traces via OTLP. O SDK inteiro fica DESLIGADO por padrão e só é ativado
# quando existe license key: sem ela o New Relic recusa o lote e o pod loga
# "Failed to export spans" a cada ciclo, poluindo o log estruturado. Para
# ligar, definir no Deployment (junto com o Secret da chave):
#   OTEL_SDK_DISABLED=false
#
# Note que o exportador NÃO é configurado como "otlp": no Quarkus o valor
# correto é "cdi" (o default), porque a extensão registra o próprio
# exportador. Forçar "otlp" delega ao autoconfigure do SDK puro, que
# procura um SPI que o Quarkus não registra — e o startup falha com
# "opentelemetry-exporter-otlp not found on classpath" mesmo com o jar
# presente na imagem.
%prod.quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}

# http/protobuf (porta 4318) em vez de gRPC (4317): é o transporte que o
# New Relic documenta como padrão e o que o próprio Quarkus sugere quando o
# handshake gRPC falha.
%prod.quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
# New Relic (US): https://otlp.nr-data.net:4318 · (EU): https://otlp.eu01.nr-data.net:4318
%prod.quarkus.otel.exporter.otlp.traces.endpoint=${OTLP_ENDPOINT:https://otlp.nr-data.net:4318}
%prod.quarkus.otel.exporter.otlp.traces.headers=api-key=${NEW_RELIC_LICENSE_KEY:}

# SDK desligado em dev/test: nada sai da máquina. O traceId continua
# aparecendo nos logs, que é o que interessa para depurar localmente.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# Logs estruturados em JSON, com traceId/spanId para correlacionar requisições.
# Console legível em dev; JSON só onde algo vai coletar (prod).
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true
%prod.quarkus.log.console.json.additional-field."service.name".value=oficina-app

# Métricas técnicas + de negócio expostas em /q/metrics (formato Prometheus).
quarkus.micrometer.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ===== Profile %dev =====
# Eco de SQL desligado para manter o console limpo em demonstrações.
# Para depurar queries, troque para true (só afeta o modo dev).
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.log.category."br.com.fiap.techchallenge".level=DEBUG

# ===== Profile %test =====
# Usa Testcontainers Postgres via devservices (mais fiel que H2).
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.generation=validate
%test.oficina.admin.password=admin123
%test.quarkus.log.category."org.hibernate.sql.results.jdbc.internal.DeferredResultSetAccess".level=ERROR
